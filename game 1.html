<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>软萌动物揉脸解压馆 🐾</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            margin: 0;
            padding: 30px 20px 40px;
            background: linear-gradient(180deg, #fdfbfb 0%, #f6e6ea 100%);
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            width: 100%;
        }
        h1 {
            font-size: 20px;
            color: #6d5959;
            margin: 0 0 10px 0;
        }
        .counter-pill {
            display: inline-block;
            background: #ffffff;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 14px;
            color: #9e7b7b;
            box-shadow: 0 4px 12px rgba(180, 140, 140, 0.12);
        }
        #quote-box {
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 15px;
            color: #d66d75;
            font-weight: 500;
            padding: 0 15px;
            margin-top: 10px;
        }
        .stage {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 260px;
            height: 260px;
        }
        /* 增加呼吸待机动画，证明画面是活的 */
        @keyframes breathe {
            0%, 100% { transform: scale(1, 1); }
            50% { transform: scale(1.03, 0.97) translateY(3px); }
        }
        .pet-face {
            width: 200px;
            height: 180px;
            background: #fff9f2;
            border-radius: 50% 50% 46% 46%;
            position: relative;
            cursor: pointer;
            box-shadow: 0 14px 28px rgba(166, 130, 118, 0.18),
                        inset 0 -8px 16px rgba(235, 210, 190, 0.5);
            animation: breathe 2.5s infinite ease-in-out;
            transition: transform 0.1s ease-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* 捏扁动效优先级最高 */
        .pet-face.squish {
            animation: none !important;
            transform: scale(1.22, 0.78) translateY(14px) !important;
        }
        .ear {
            position: absolute;
            z-index: -1;
            transition: all 0.2s;
        }
        .cat .ear-left {
            width: 55px; height: 65px; background: #ffd8be;
            top: -22px; left: 18px; border-radius: 15px 50px 0 0;
            transform: rotate(-18deg);
        }
        .cat .ear-right {
            width: 55px; height: 65px; background: #ffd8be;
            top: -22px; right: 18px; border-radius: 50px 15px 0 0;
            transform: rotate(18deg);
        }
        .dog .pet-face { background: #f5e6d3; }
        .dog .ear-left {
            width: 48px; height: 95px; background: #c89f7c;
            top: 25px; left: -18px; border-radius: 30px;
            transform: rotate(15deg); z-index: 1;
        }
        .dog .ear-right {
            width: 48px; height: 95px; background: #c89f7c;
            top: 25px; right: -18px; border-radius: 30px;
            transform: rotate(-15deg); z-index: 1;
        }
        .bunny .pet-face { background: #ffffff; }
        .bunny .ear-left {
            width: 42px; height: 105px; background: #ffe5ec;
            border: 6px solid #ffffff;
            top: -72px; left: 38px; border-radius: 25px;
            transform: rotate(-10deg);
        }
        .bunny .ear-right {
            width: 42px; height: 105px; background: #ffe5ec;
            border: 6px solid #ffffff;
            top: -72px; right: 38px; border-radius: 25px;
            transform: rotate(10deg);
        }
        .capy .pet-face { background: #c89d7c; border-radius: 46% 46% 42% 42%; }
        .capy .ear-left {
            width: 36px; height: 36px; background: #8c6244;
            top: -6px; left: 22px; border-radius: 50%;
        }
        .capy .ear-right {
            width: 36px; height: 36px; background: #8c6244;
            top: -6px; right: 22px; border-radius: 50%;
        }
        .eyes {
            display: flex;
            justify-content: space-between;
            width: 96px;
            margin-top: 10px;
        }
        .eye {
            width: 14px;
            height: 14px;
            background: #4a3b3b;
            border-radius: 50%;
            position: relative;
        }
        .eye::after {
            content: '';
            width: 4px; height: 4px; background: #fff;
            border-radius: 50%; position: absolute; top: 2px; left: 3px;
        }
        .pet-face.squish .eye {
            height: 4px;
            border-radius: 4px;
            margin-top: 5px;
        }
        .pet-face.squish .eye::after { display: none; }
        .cheeks {
            display: flex;
            justify-content: space-between;
            width: 145px;
            margin-top: 6px;
        }
        .cheek {
            width: 28px;
            height: 16px;
            background: #ffb3ba;
            border-radius: 50%;
            opacity: 0.65;
            transition: opacity 0.15s, transform 0.15s;
        }
        .pet-face.squish .cheek {
            opacity: 0.95;
            transform: scale(1.25);
        }
        .mouth {
            font-size: 20px;
            color: #5c4747;
            font-weight: bold;
            margin-top: -10px;
        }
        .floating-heart {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            100% { opacity: 0; transform: translateY(-90px) scale(1.3); }
        }
        .selector {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.85);
            padding: 8px 12px;
            border-radius: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.06);
        }
        .pet-btn {
            border: none;
            background: transparent;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            color: #7d6666;
            cursor: pointer;
            transition: all 0.2s;
        }
        .pet-btn.active {
            background: #ff9a9e;
            color: white;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(255, 154, 158, 0.4);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🐾 软萌动物揉脸解压馆 🐾</h1>
        <div class="counter-pill">已rua次数：<span id="count">0</span> 下</div>
        <div id="quote-box">快戳戳它软乎乎的脸蛋吧~</div>
    </div>

    <div class="stage cat" id="stage">
        <div class="pet-face" id="pet">
            <div class="ear ear-left"></div>
            <div class="ear ear-right"></div>
            <div class="eyes">
                <div class="eye"></div>
                <div class="eye"></div>
            </div>
            <div class="cheeks">
                <div class="cheek"></div>
                <div class="cheek"></div>
            </div>
            <div class="mouth" id="mouth">ω</div>
        </div>
    </div>

    <div class="selector">
        <button class="pet-btn active" onclick="switchPet('cat', this)">🐱 奶糖猫</button>
        <button class="pet-btn" onclick="switchPet('dog', this)">🐶 曲奇狗</button>
        <button class="pet-btn" onclick="switchPet('bunny', this)">🐰 草莓兔</button>
        <button class="pet-btn" onclick="switchPet('capy', this)">🦫 佛系豚</button>
    </div>

    <script>
        var count = 0;
        var pet = document.getElementById('pet');
        var stage = document.getElementById('stage');
        var countEl = document.getElementById('count');
        var quoteBox = document.getElementById('quote-box');
        var mouth = document.getElementById('mouth');

        var quotes = [
            "呼噜呼噜~ 好舒服呀！",
            "你的烦恼已经被我吃掉啦！",
            "再捏一下，今天就会有好事发生~",
            "全世界最可爱的女孩正在摸我呢 ✨",
            "深呼吸，放轻松，我一直陪着你~",
            "被你rua得好幸福，贴贴！",
            "坏心情统统变成小泡泡飞走啦~"
        ];

        var emojis = ['💖', '✨', '🌸', '💕', '🐾', '🍓'];
        var audioCtx = null;

        function playCuteSound() {
            try {
                var AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                if (!audioCtx) audioCtx = new AudioContext();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                osc.type = 'triangle';
                
                var now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(480 + Math.random() * 80, now);
                osc.frequency.exponentialRampToValueAtTime(760, now + 0.1);

                gain.gain.setValueAtTime(0.35, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.1);
            } catch (err) {}
        }

        function spawnHeart() {
            var heart = document.createElement('div');
            heart.className = 'floating-heart';
heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
heart.style.left = (110 + (Math.random() * 60 - 30)) + 'px';
heart.style.top = '80px';
stage.appendChild(heart);
setTimeout(function() { heart.remove(); }, 800);
}
function squishPet(e) {
if (e && e.type === 'touchstart') e.preventDefault();
playCuteSound();
count++;
countEl.innerText = count;
pet.classList.remove('squish');
void pet.offsetWidth; // 强制刷新动画
pet.classList.add('squish');
mouth.innerText = 'o';
spawnHeart();
if (navigator.vibrate) {
try { navigator.vibrate(20); } catch(err) {}
}
if (count % 5 === 0) {
quoteBox.innerText = quotes[Math.floor(Math.random() * quotes.length)];
}
setTimeout(function() {
pet.classList.remove('squish');
mouth.innerText = 'ω';
}, 140);
}
// 同时绑定鼠标点击和手机触摸
pet.addEventListener('mousedown', squishPet);
pet.addEventListener('touchstart', squishPet, { passive: false });
function switchPet(type, btn) {
playCuteSound();
stage.className = 'stage ' + type;
var btns = document.querySelectorAll('.pet-btn');
for (var i = 0; i < btns.length; i++) {
btns[i].classList.remove('active');
}
btn.classList.add('active');
var greetings = {
cat: "喵呜~ 奶糖猫上线，快来捏捏！",
dog: "汪！曲奇狗把耳朵递给你揉~",
bunny: "草莓兔来啦，今天也要开心呀！",
capy: "佛系水豚：随便捏，情绪稳定~"
};
quoteBox.innerText = greetings[type];
}
